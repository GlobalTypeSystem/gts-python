[build-system]
requires = ["hatchling>=1.21.1"]
build-backend = "hatchling.build"

[project]
name = "gts"
version = "0.13.1"
description = "Global Type System (GTS) helpers: identifiers, parsing, validation, and operations"
readme = "README.md"
authors = [{ name = "GTS Community" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
  "jsonschema[format-nongpl]>=4.18,<5",
  "referencing>=0.30,<0.37",
  "jsonsubschema>=0.0.8,<0.1",
  "fastapi>=0.110,<1",
  "uvicorn>=0.23,<1",
  "pyyaml>=6.0,<7",
  "regex==2025.11.3",
  "eval_type_backport>=0.1,<0.3; python_version < '3.10'"
]

[project.urls]
Homepage = "https://github.com/globaltypesystem"
Repository = "https://github.com/globaltypesystem/gts-python"

[project.scripts]
gts = "gts._cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gts"]
